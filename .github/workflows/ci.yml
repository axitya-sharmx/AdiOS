name: CI

on:
  push:
  pull_request:

jobs:
  boot-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build ISO
        run: make iso

      - name: Boot in QEMU and capture serial log
        run: |
          timeout 20 qemu-system-x86_64 -cdrom build/adios.iso -serial file:serial.log \
            -display none -no-reboot -no-shutdown -machine accel=tcg || true
          cat serial.log

      - name: Check boot log
        run: |
          grep -q "\[INIT\] Kernel initialized" serial.log
          grep -q "cpu_id=0" serial.log
          grep -q "\[PMM \] buddy allocator ready" serial.log
          grep -q "\[PMM \] self-test passed" serial.log
          grep -q "\[VMM \] self-test passed" serial.log
          grep -q "\[HEAP\] self-test passed" serial.log
          grep -q "\[IRQ \] PIC remapped, PIT at 100 Hz, interrupts enabled" serial.log
          grep -q "\[IRQ \] timer self-test passed" serial.log
          grep -q "\[SCHD\] round-robin self-test passed" serial.log
          grep -q "\[SYSC\] int 0x80 self-test passed" serial.log

      - name: Build fault-injection ISO (exercises IDT/ISR path)
        run: make iso-fault-test

      - name: Boot fault-injection ISO and capture serial log
        run: |
          timeout 20 qemu-system-x86_64 -cdrom build/adios.iso -serial file:fault.log \
            -display none -no-reboot -no-shutdown -machine accel=tcg || true
          cat fault.log

      - name: Check fault dump
        run: |
          grep -q "Reason: Breakpoint" fault.log
